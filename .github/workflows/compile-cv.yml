name: Compile and Release CV

on:
  push:
    branches: [main]
    paths:
      - "cv/cv.tex"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup TeX Live
        uses: te-mac/setup-texlive-action@v3

      - name: Compile LaTeX to PDF
        run: |
          cd cv
          pdflatex cv.tex

      - name: Upload PDF to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest CV
          files: cv/cv.pdf
          make_latest: true
