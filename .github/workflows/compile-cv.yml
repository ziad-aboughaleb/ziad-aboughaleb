name: Compile and Release CV

on:
  push:
    branches: [main]
    paths:
      - "cv/cv.tex"

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Added caching to speed up your builds
      - name: Cache Tectonic packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-${{ hashFiles('cv/cv.tex') }}
          restore-keys: |
            ${{ runner.os }}-tectonic-

      # 2. Corrected the action name here
      - name: Setup Tectonic
        uses: wtfjoke/setup-tectonic@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile LaTeX to PDF
        run: tectonic cv/cv.tex

      - name: Upload PDF to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest CV
          files: cv/cv.pdf
          make_latest: true
